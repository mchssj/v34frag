name = "cmleague-clips"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Cuenta de Cloudflare de Daniel (la de los clips; las demos están en otra cuenta).
account_id = "f9aab74b3e17be485adeade51fa2f32e"

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "cmleague-clips"
# `wrangler dev --remote` exige un bucket de "preview"; se usa el mismo.
preview_bucket_name = "cmleague-clips"

# La máquina de render sube directo con las claves S3 (render/r2.py). Este Worker sirve los videos y, dos veces por
# día, revisa que el bucket no pase de R2_MAX_BYTES (docs/bitacora/2026-11-10-r2-tope-10gb).
[triggers]
crons = ["53 5,17 * * *"]

[vars]
# 10 GB gratis por cuenta: por encima de R2_MAX_BYTES se borran de R2 los clips que ya están en Drive, hasta
# R2_TARGET_BYTES (GB decimales).
R2_MAX_BYTES = "10000000000"
R2_TARGET_BYTES = "9500000000"
SUPABASE_URL = "https://db.cmleague.lat"
# Clave pública (la misma que usa la web y el Worker de demos).
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtemZ3c2l6YXNocHN6eGx2cGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNjU2NzQsImV4cCI6MjEwNjc0MTY3NH0.QO9osfgwKAXTi9wzOHb68JjGYYHFbHRejtu9b3ZUEP4"

# Secretos (no van en este archivo): pnpm exec wrangler secret put RENDER_TOKEN / ADMIN_KEY
#   RENDER_TOKEN: un token de render_workers propio (nombre clips-worker), para clip_r2_evict_due y clip_r2_evicted.
#   ADMIN_KEY: protege /trim.
# Despliegue: CLOUDFLARE_API_TOKEN=<CF_API_TOKEN_CLIPS del .env> pnpm exec wrangler deploy
