# Compila el instalador del launcher de escritorio en Windows (docs/bitacora/2026-11-24-launcher-escritorio).
# Así no hace falta instalar Rust ni las Build Tools de Visual Studio en una PC para probarlo.
# El instalador queda como artefacto de la corrida ("cmleague-launcher-windows"). Solo se publica (R2 de Daniel, en
# https://descargas.cmleague.lat/launcher/) al correrlo a mano con "Publicar en R2" marcado.
name: Launcher

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar en R2 (los launcher instalados se actualizan a esta versión)"
        type: boolean
        default: false
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
      # Cambiar solo la documentación no arma otro instalador.
      - "!launcher/**/*.md"

permissions:
  contents: read

# Dos push seguidos a la misma rama: se cancela la corrida vieja y queda la del último. Una publicación no se cancela.
concurrency:
  group: launcher-${{ github.ref }}-${{ inputs.publicar && 'publicar' || 'prueba' }}
  cancel-in-progress: ${{ !inputs.publicar }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm 12.8.1 con Corepack, como pide package.json ("packageManager").
      - name: pnpm
        run: |
          corepack enable
          pnpm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Pruebas de Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Lo que se enciende con datos que pone Daniel en GitHub (Settings › Secrets and variables › Actions):
      # - variable CMLEAGUE_UPDATER_PUBKEY y secreto TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD):
      #   actualizaciones automáticas. Sin ellos, el launcher no busca actualizaciones.
      # - variable CMLEAGUE_DISCORD_APP_ID: Discord Rich Presence. Sin ella, no muestra nada en Discord.
      - name: Instalador
        shell: pwsh
        env:
          CMLEAGUE_UPDATER_PUBKEY: ${{ vars.CMLEAGUE_UPDATER_PUBKEY }}
          CMLEAGUE_DISCORD_APP_ID: ${{ vars.CMLEAGUE_DISCORD_APP_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -and $env:CMLEAGUE_UPDATER_PUBKEY) {
            # Al firmar, Tauri verifica la firma con plugins.updater.pubkey de la configuración, que en tauri.conf.json
            # está vacía ("Missing comment in public key", 2026-11-26). Se arma con la de CMLEAGUE_UPDATER_PUBKEY. La app
            # no la lee de ahí: la recibe al compilar (updater.rs).
            # Archivo y no JSON en la línea: pnpm en Windows pasa por cmd, que rompe las comillas.
            @{ bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $env:CMLEAGUE_UPDATER_PUBKEY.Trim() } } } |
              ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM src-tauri/tauri.updater.ci.json
            pnpm tauri build --config src-tauri/tauri.updater.ci.json
          } else {
            Write-Host "Sin clave de firma: el instalador sale sin actualizaciones automáticas."
            pnpm tauri build
          }

      # Que abra y se quede abierto (el 2026-11-25 una versión se cerraba al arrancar sin mostrar nada). Sin capturas:
      # se sacan solo cuando Kyan las pide.
      - name: Abre y no se cierra
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src-tauri/target/release/cmleague-launcher.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "lat.cmleague.launcher/error.log"
            if (Test-Path $log) { Get-Content $log }
            throw "El launcher se cerró solo (código $($p.ExitCode))."
          }
          Write-Host "Sigue abierto después de 25 s."
          Stop-Process -Id $p.Id -Force

      # Configuración: un cambio hecho desde su ventana (como un clic) tiene que quedar en ajustes.json. Usa un build
      # aparte con --features autoprueba (solo recompila el launcher, no las dependencias): el instalador de arriba no la
      # trae. Pisa target/release/cmleague-launcher.exe, pero el instalador ya está armado en bundle/.
      - name: Configuración se guarda
        shell: pwsh
        run: |
          pnpm tauri build --no-bundle --features autoprueba
          $archivo = Join-Path $env:APPDATA "lat.cmleague.launcher/ajustes.json"
          Remove-Item $archivo -ErrorAction SilentlyContinue
          $env:CMLEAGUE_AUTOPRUEBA = "1"
          $p = Start-Process -FilePath "src-tauri/target/release/cmleague-launcher.exe" -PassThru
          Start-Sleep -Seconds 35
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          # Lo que mostraba la página (el aviso de arriba, si hay IPC, si los interruptores estaban bloqueados).
          $diag = Join-Path $env:LOCALAPPDATA "lat.cmleague.launcher/autoprueba.txt"
          if (Test-Path $diag) { Write-Host "Página: $(Get-Content $diag -Raw)" } else { Write-Host "Página: sin datos" }
          $web = Join-Path $env:LOCALAPPDATA "lat.cmleague.launcher/autoprueba-web.txt"
          if (Test-Path $web) { Write-Host "Web: $(Get-Content $web -Raw)" } else { Write-Host "Web: sin datos" }
          if (-not (Test-Path $archivo)) {
            Get-ChildItem (Join-Path $env:APPDATA "lat.cmleague.launcher") -ErrorAction SilentlyContinue
            throw "No se guardó la configuración: no existe $archivo."
          }
          $json = Get-Content $archivo -Raw
          Write-Host $json
          $s = $json | ConvertFrom-Json
          if ($s.notifications -ne $false -or $s.discord_presence -ne $false) { throw "ajustes.json no tiene el cambio." }
          Write-Host "La configuración se guarda."

      # latest.json para https://descargas.cmleague.lat/launcher/ (solo con la clave de firma).
      - name: latest.json
        if: ${{ hashFiles('launcher/src-tauri/target/release/bundle/nsis/*.sig') != '' }}
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$dir/*-setup.exe" | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          @{
            version = $version
            notes = ""
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://descargas.cmleague.lat/launcher/$($exe.Name)" } }
          } | ConvertTo-Json -Depth 5 | Set-Content "$dir/latest.json" -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: cmleague-launcher-windows
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            launcher/src-tauri/target/release/bundle/nsis/*.sig
            launcher/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 14

      # Publicar: solo a mano y con "Publicar en R2". Primero el instalador y después latest.json, así un launcher
      # instalado nunca ve una versión cuyo instalador todavía no está. Datos que pone Daniel en GitHub:
      # - variables R2_ACCOUNT_ID y R2_BUCKET;
      # - secretos R2_ACCESS_KEY_ID y R2_SECRET_ACCESS_KEY, de un token de R2 que solo escribe en ese bucket.
      - name: Publicar en R2
        if: ${{ inputs.publicar }}
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          if (-not (Test-Path "$dir/latest.json")) { throw "Sin latest.json: falta la clave de firma del actualizador (TAURI_SIGNING_PRIVATE_KEY y CMLEAGUE_UPDATER_PUBKEY)." }
          if (-not $env:R2_ACCOUNT_ID -or -not $env:R2_BUCKET -or -not $env:AWS_ACCESS_KEY_ID) { throw "Faltan los datos de R2 en GitHub (R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY)." }
          $endpoint = "https://$($env:R2_ACCOUNT_ID).r2.cloudflarestorage.com"
          $exe = Get-ChildItem "$dir/*-setup.exe" | Select-Object -First 1
          aws s3 cp $exe.FullName "s3://$($env:R2_BUCKET)/launcher/$($exe.Name)" --endpoint-url $endpoint --content-type application/octet-stream
          if ($LASTEXITCODE -ne 0) { throw "No se subió el instalador." }
          aws s3 cp "$dir/latest.json" "s3://$($env:R2_BUCKET)/launcher/latest.json" --endpoint-url $endpoint --content-type application/json --cache-control no-cache
          if ($LASTEXITCODE -ne 0) { throw "No se subió latest.json." }
          Write-Host "Publicado: https://descargas.cmleague.lat/launcher/$($exe.Name)"
