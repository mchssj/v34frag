[package]
name = "cmleague-launcher"
version = "0.1.0"
description = "Launcher de escritorio de CMLeague"
edition = "2021"

[lib]
name = "cmleague_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
