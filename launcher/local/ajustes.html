<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configuración de CMLeague</title>
    <!-- Configuración propia del launcher. Se guarda en esta PC (ajustes.json) y no cambia nada de la web. -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --card: #171717;
        --line: #262626;
        --text: #fafafa;
        --muted: #a1a1a1;
        --primary: #ff6900;
        --danger: #ff6467;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
      main { padding: 20px; display: grid; gap: 16px; }
      header { display: flex; align-items: center; gap: 12px; }
      header img { width: 36px; height: 36px; }
      h1 { font-size: 18px; margin: 0; }
      .muted { color: var(--muted); }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      section h2 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 12px 16px 4px; }
      label.row { display: flex; gap: 12px; align-items: center; padding: 10px 16px; cursor: pointer; }
      label.row + label.row { border-top: 1px solid var(--line); }
      .row .txt { flex: 1; display: grid; }
      .row small { color: var(--muted); }
      .row.off { opacity: .5; cursor: default; }
      /* Interruptor */
      input[type=checkbox] { appearance: none; width: 38px; height: 22px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; }
      input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transition: transform .15s; }
      input[type=checkbox]:checked { background: var(--primary); }
      input[type=checkbox]:checked::after { transform: translateX(16px); background: #0a0a0a; }
      input[type=checkbox]:focus-visible, button:focus-visible, input[type=text]:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .field { padding: 10px 16px 14px; display: grid; gap: 8px; }
      .inline { display: flex; gap: 8px; }
      input[type=text] { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
      button { background: var(--line); color: var(--text); border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
      button.primary { background: var(--primary); color: #0a0a0a; font-weight: 600; }
      button:disabled { opacity: .5; cursor: default; }
      .msg { min-height: 1.4em; margin: 0; font-size: 13px; }
      .msg.err { color: var(--danger); }
      footer { display: flex; align-items: center; gap: 8px; }
      footer .grow { flex: 1; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="logo.svg" alt="" />
        <div>
          <h1>Configuración</h1>
          <div class="muted">Solo de este launcher, en esta PC. No cambia la web.</div>
        </div>
      </header>

      <section>
        <h2>General</h2>
        <label class="row"><span class="txt">Abrir con Windows<small>El launcher arranca solo al prender la PC.</small></span><input type="checkbox" data-key="start_with_windows" /></label>
        <label class="row" data-needs="start_with_windows"><span class="txt">Arrancar en la bandeja<small>Al abrirse con Windows, queda en la bandeja sin abrir la ventana.</small></span><input type="checkbox" data-key="start_minimized" /></label>
        <label class="row"><span class="txt">Cerrar a la bandeja<small>La X no cierra el launcher: sigues en la cola y te avisa.</small></span><input type="checkbox" data-key="close_to_tray" /></label>
      </section>

      <section>
        <h2>Partidas</h2>
        <label class="row"><span class="txt">Avisos de Windows<small>Partida encontrada, servidor listo y actualizaciones.</small></span><input type="checkbox" data-key="notifications" /></label>
        <label class="row"><span class="txt">Traer la ventana al frente<small>Cuando aparece la partida o el servidor está listo.</small></span><input type="checkbox" data-key="bring_to_front" /></label>
        <label class="row"><span class="txt">Mostrar en Discord<small>"Buscando partida", "Jugando 5v5 · de_dust2"…</small></span><input type="checkbox" data-key="discord_presence" /></label>
      </section>

      <section>
        <h2>Apariencia</h2>
        <label class="row"><span class="txt">Tema de mi perfil<small>Pinta el launcher con el tema de la tienda que tienes puesto en tu perfil. Si no tienes uno puesto, no cambia nada.</small></span><input type="checkbox" data-key="shop_theme" /></label>
      </section>

      <section>
        <h2>ClientMod</h2>
        <div class="field">
          <span class="muted">Carpeta donde está <code>CMLauncher.exe</code>.</span>
          <div class="inline">
            <input type="text" id="dir" placeholder="C:\CSSv34_ClientMod" spellcheck="false" />
            <button id="save-dir">Guardar</button>
          </div>
          <p class="msg" id="dir-msg"></p>
        </div>
      </section>

      <section>
        <h2>Actualizaciones</h2>
        <label class="row"><span class="txt">Buscar actualizaciones solo<small>Al abrir y cada 6 horas. Se instalan cuando tú lo eliges.</small></span><input type="checkbox" data-key="auto_update" /></label>
        <div class="field">
          <footer>
            <span class="muted">Versión <span id="version">–</span></span>
            <span class="grow"></span>
            <button id="check">Buscar ahora</button>
            <button id="install" class="primary" hidden>Instalar</button>
          </footer>
          <p class="msg" id="upd-msg"></p>
        </div>
      </section>

      <p class="msg" id="msg"></p>
    </main>

    <script>
      const ipc = window.__TAURI_INTERNALS__
      const invoke = (cmd, args) => ipc.invoke(cmd, args)
      const $ = (id) => document.getElementById(id)
      const say = (el, text, err) => { el.textContent = text || ""; el.classList.toggle("err", !!err) }
      const errText = (e) => (typeof e === "string" ? e : (e && e.message) || String(e))
      let current = null

      function paint() {
        document.querySelectorAll("input[data-key]").forEach((i) => { i.checked = !!current[i.dataset.key] })
        document.querySelectorAll("[data-needs]").forEach((row) => {
          const on = !!current[row.dataset.needs]
          row.classList.toggle("off", !on)
          row.querySelector("input").disabled = !on
        })
      }

      async function load() {
        current = await invoke("settings_get")
        paint()
        const game = await invoke("game_detect").catch(() => null)
        $("dir").value = current.clientmod_dir || (game && game.dir) || ""
        say($("dir-msg"), game ? `Encontrado en ${game.dir}.` : "No encontré ClientMod en las carpetas comunes.", !game)
        $("version").textContent = await invoke("app_version").catch(() => "–")
      }

      document.querySelectorAll("input[data-key]").forEach((input) =>
        input.addEventListener("change", async () => {
          const next = { ...current, [input.dataset.key]: input.checked }
          try {
            current = await invoke("settings_set", { settings: next })
            say($("msg"), "Guardado.")
          } catch (e) {
            say($("msg"), errText(e), true)
          }
          paint()
        })
      )

      $("save-dir").addEventListener("click", async () => {
        try {
          const game = await invoke("game_set_dir", { dir: $("dir").value })
          current = await invoke("settings_get")
          say($("dir-msg"), `Guardado: ${game.dir}.`)
        } catch (e) {
          say($("dir-msg"), errText(e), true)
        }
      })

      $("check").addEventListener("click", async () => {
        $("check").disabled = true
        say($("upd-msg"), "Buscando…")
        try {
          const v = await invoke("update_check")
          $("install").hidden = !v
          say($("upd-msg"), v ? `Hay una versión nueva: ${v}.` : "Tienes la última versión.")
        } catch (e) {
          say($("upd-msg"), errText(e), true)
        } finally {
          $("check").disabled = false
        }
      })

      $("install").addEventListener("click", async () => {
        $("install").disabled = true
        say($("upd-msg"), "Descargando e instalando. El launcher se reinicia solo…")
        try {
          await invoke("update_install")
        } catch (e) {
          say($("upd-msg"), errText(e), true)
          $("install").disabled = false
        }
      })

      load().catch((e) => say($("msg"), errText(e), true))
    </script>
  </body>
</html>
