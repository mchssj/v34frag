<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07040f"/><stop offset=".6" stop-color="#2a0d3a"/><stop offset="1" stop-color="#4d0f45"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset=".5" stop-color="#ff5fa2"/><stop offset="1" stop-color="#b02aff"/></linearGradient>
    <clipPath id="half"><rect x="660" y="200" width="600" height="420"/></clipPath>
    <mask id="stripes"><rect x="0" y="0" width="1920" height="1080" fill="#fff"/><g fill="#000"><rect x="600" y="470" width="720" height="10"/><rect x="600" y="510" width="720" height="14"/><rect x="600" y="552" width="720" height="18"/><rect x="600" y="596" width="720" height="22"/></g></mask>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
