    <path d="M40 194 H220 L208 208 L220 222 H40 L52 208 Z" fill="#E6A927" stroke="#0B0C10" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M56 197 H204" stroke="#FFFFFF" stroke-width="1.4" opacity=".35" />
    <text id="texto-banda" x="130" y="212.5" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.2" text-anchor="middle" fill="#FFFFFF">BICAMPEÓN</text>
