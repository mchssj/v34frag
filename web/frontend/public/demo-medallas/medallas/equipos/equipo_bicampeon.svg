    <path id="cara" d="M42 32 H218 V262 L130 234 L42 262 Z" transform="translate(11.70 12.69) scale(0.91)" fill="#2A2214" stroke="#0B0C10" stroke-width="3" />
    <path id="filete-acento" d="M42 32 H218 V262 L130 234 L42 262 Z" transform="translate(19.50 21.15) scale(0.85)" fill="none" stroke="#E6A927" stroke-width="1.5" opacity=".5" />
