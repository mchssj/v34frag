      <stop offset="0" stop-color="#FFFFFF" /><stop offset=".28" stop-color="#BFC4CD" />
      <stop offset=".5" stop-color="#4A505B" /><stop offset=".68" stop-color="#BFC4CD" />
      <stop offset=".82" stop-color="#FFFFFF" stop-opacity=".9" /><stop offset="1" stop-color="#4A505B" />
    </linearGradient>
    <clipPath id="recorte-forma"><path d="M28 142 A102 102 0 1 1 232 142 A102 102 0 1 1 28 142 Z" /></clipPath>
  <filter id="resplandor-marco" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" /></filter></defs>
  <g id="cinta">
    <path d="M76 8 L184 8 L198 30 L184 50 L76 50 L62 30 Z" fill="#3B1F7A" stroke="#0B0C10" stroke-width="3" stroke-linejoin="round" />
    <path d="M90 9 L110 9 L114 49 L94 49 Z" fill="#8B5CF6" />
    <path d="M150 9 L170 9 L166 49 L146 49 Z" fill="#8B5CF6" />
    <path d="M119 9 L141 9 L139 49 L121 49 Z" fill="#0F1014" />
    <path d="M128 9 L132 9 L131.5 49 L128.5 49 Z" fill="#8B5CF6" opacity=".8" />
    <rect id="pasador" x="96" y="44" width="68" height="9" rx="4" fill="#BFC4CD" stroke="#0B0C10" stroke-width="2" />
  </g>
  <g id="forma-circulo">
    <path id="resplandor-marco" d="M28 142 A102 102 0 1 1 232 142 A102 102 0 1 1 28 142 Z" fill="none" stroke="#BFC4CD" stroke-width="26" stroke-linejoin="round" opacity=".55" filter="url(#resplandor-marco)" /><path id="borde-exterior" d="M28 142 A102 102 0 1 1 232 142 A102 102 0 1 1 28 142 Z" fill="#0B0C10" stroke="#0B0C10" stroke-width="18" stroke-linejoin="round" />
    <path id="marco-metal" d="M28 142 A102 102 0 1 1 232 142 A102 102 0 1 1 28 142 Z" fill="url(#metal)" stroke="url(#metal)" stroke-width="10" stroke-linejoin="round" />
    <path id="filete-claro" d="M28 142 A102 102 0 1 1 232 142 A102 102 0 1 1 28 142 Z" transform="translate(7.80 8.46) scale(0.94)" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".55" />
    <path id="cara" d="M28 142 A102 102 0 1 1 232 142 A102 102 0 1 1 28 142 Z" transform="translate(11.70 12.69) scale(0.91)" fill="#221A3A" stroke="#0B0C10" stroke-width="3" />
    <path id="filete-acento" d="M28 142 A102 102 0 1 1 232 142 A102 102 0 1 1 28 142 Z" transform="translate(19.50 21.15) scale(0.85)" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity=".5" />
    </g>
  <g id="textos-editables" font-family="Montserrat, Arial, sans-serif" text-anchor="middle">
    <g id="etiqueta">
      <rect x="104.0" y="56" width="52.0" height="22" rx="11" fill="#121318" stroke="#8B5CF6" stroke-width="2" />
      <text x="130" y="72.5" font-size="15" font-weight="800" letter-spacing=".8" fill="#DDD6FE">S1</text>
    </g>
