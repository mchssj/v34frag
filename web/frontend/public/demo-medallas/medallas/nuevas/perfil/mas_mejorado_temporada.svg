    <path d="M124 206 V226" stroke="#FFFFFF" stroke-width="2.4" opacity=".5" stroke-linecap="round" />
  </g>
  <g id="banda" transform="translate(0 0)">
    <path d="M40 194 H220 L208 208 L220 222 H40 L52 208 Z" fill="#0B0C10" transform="translate(0 2)" opacity=".6" />
    <path d="M40 194 H220 L208 208 L220 222 H40 L52 208 Z" fill="#8B5CF6" stroke="#0B0C10" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M56 197 H204" stroke="#FFFFFF" stroke-width="1.4" opacity=".35" />
    <text id="texto-banda" x="130" y="212.5" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.2" text-anchor="middle" fill="#FFFFFF">+ MEJORADO</text>
