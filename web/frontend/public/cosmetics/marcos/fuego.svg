<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .09" numOctaves="2" seed="3" result="n">
        <animate attributeName="seed" values="1;2;3;4;5;6;7;8" dur=".8s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2"/>
    </filter>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff2a00"/><stop offset=".5" stop-color="#ff8a00"/><stop offset="1" stop-color="#ffe14d"/></linearGradient>
    <mask id="m"><rect width="256" height="256" fill="#fff"/><rect x="34" y="34" width="188" height="188" rx="8" fill="#000"/></mask>
  </defs>
  <g mask="url(#m)" filter="url(#f)">
    <rect x="18" y="18" width="220" height="220" rx="14" fill="none" stroke="url(#fl)" stroke-width="20"/>
    <g fill="url(#fl)">
      <path d="M40 30c6-14 2-22 10-30 0 10 8 14 4 30Z"/><path d="M110 22c4-12 0-18 8-22 0 8 6 12 2 22Z"/><path d="M170 26c6-12 2-20 10-26 0 10 6 14 2 26Z"/>
      <path d="M226 50c12-6 18-2 30-8-8 6-10 14-30 14Z"/><path d="M228 140c12-4 16 0 28-6-8 6-8 12-28 12Z"/>
      <path d="M30 220c-10 6-16 2-30 8 8-8 10-14 30-14Z"/><path d="M26 110c-10 4-16 0-26 6 8-6 8-12 26-12Z"/>
    </g>
  </g>
  <rect x="32" y="32" width="192" height="192" rx="8" fill="none" stroke="#ffb13b" stroke-width="3">
    <animate attributeName="stroke" values="#ffb13b;#ff5a1f;#ffb13b" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <g fill="#ffd36e">
    <circle cx="60" cy="240" r="2"><animate attributeName="cy" values="250;0" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="236" cy="240" r="2"><animate attributeName="cy" values="250;10" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="240" r="1.5"><animate attributeName="cy" values="250;20" dur="2.2s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.2s" begin=".5s" repeatCount="indefinite"/></circle>
  </g>
