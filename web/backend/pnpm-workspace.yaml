# Ajustes de pnpm para este proyecto (no es un monorepo).

# Solo se instalan versiones publicadas hace al menos 7 días (en minutos). Al configurarlo a mano,
# pnpm lo aplica en modo estricto: falla en vez de instalar algo más nuevo.
minimumReleaseAge: 10080

# Rechaza una versión publicada con menos garantías (provenance) que las anteriores.
trustPolicy: no-downgrade

# Paquetes autorizados a correr scripts de instalación. El resto queda bloqueado.
allowBuilds:
  esbuild: true    # binario nativo, lo usan wrangler y tsx
  workerd: true    # runtime local de Cloudflare Workers (wrangler dev)
  ssh2: false        # opcional: compila un módulo nativo para cifrar más rápido; sin él usa JavaScript puro
  cpu-features: false  # opcional, lo pide ssh2 para elegir el cifrado
