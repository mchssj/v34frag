// CSSTV Match Reporter - configuración
// Este archivo va en cstrike/cfg/sourcemod/csstv_reporter.cfg

// --- Conexión con la web (copiar desde la web: Admin > Servidores) ---
csstv_api_url "https://wmzfwsizashpszxlvpeb.supabase.co/rest/v1/rpc/ingest_server_chunk"
csstv_api_key "PEGAR_ANON_KEY"
csstv_server_token "PEGAR_TOKEN"
csstv_server_tag "srv1"

// --- Envío ---
// 1 = envía con la extensión System2. 0 = solo guarda en la cola (usar csstv_uploader.py)
csstv_send "1"
csstv_retry_seconds "60"

// --- Formato de partida ---
csstv_maxrounds "30"          // MR15
csstv_overtime "1"            // prórroga si hay empate
csstv_ot_maxrounds "24"       // MR12 por prórroga (6 = MR3)
csstv_ot_startmoney "10000"
csstv_lo3 "1"
csstv_halftime_delay "3.0"

// --- Inicio ---
csstv_ready_system "1"        // empieza cuando todos escriben !ready
csstv_min_players "8"         // mínimo de jugadores en CT+T

// --- Estadísticas ---
csstv_assist_damage "41"
csstv_validate_steamid "0"    // dejar en 0 en servidores no-Steam
csstv_include_bots "0"        // solo para pruebas

// --- Durante la partida ---
csstv_chat_tag "v34frag"      // prefijo de los mensajes: [v34frag]
csstv_chat_colors "1"         // 0 solo colores básicos, 1 RGB para quien usa ClientMod, 2 siempre RGB
csstv_round_header "1"        // "Ronda 12/30 · A 7 - 4 B", último round antes del cambio y match point
csstv_damage_report "1"       // a cada jugador, el daño de la ronda anterior
csstv_team_money "1"          // a cada equipo, su plata al empezar la ronda
csstv_hp_on_death "1"         // al morir: quién te mató y cuánta vida le quedó (y !hp)

// --- Pausa táctica (!pause / !unpause) ---
csstv_pause_mode "3"          // 0 desactivadas, 1 con tiempo, 2 hasta !unpause de los dos equipos, 3 con tiempo o !unpause
csstv_pause_max "2"           // pausas por equipo y por partida
csstv_pause_time "60"         // segundos de cada pausa (modos 1 y 3)

// --- Demo (requiere +tv_enable 1 en la línea de arranque) ---
csstv_demo "1"                // grabar cstrike/csstv_demos/<match_uid>.dem
csstv_demo_keep "50"          // demos que se conservan (0 = todos)

csstv_enabled "1"
