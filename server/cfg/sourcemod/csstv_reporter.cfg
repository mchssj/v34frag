// CSSTV Match Reporter - configuración
// Este archivo va en cstrike/cfg/sourcemod/csstv_reporter.cfg

// --- Conexión con la web (copiar desde la web: Admin > Servidores) ---
csstv_api_url "https://wmzfwsizashpszxlvpeb.supabase.co/rest/v1/rpc/ingest_server_chunk"
csstv_api_key "PEGAR_ANON_KEY"
csstv_server_token "PEGAR_TOKEN"
csstv_server_tag "srv1"

// --- Envío ---
// 1 = envía con la extensión System2. 0 = solo guarda en la cola (usar csstv_uploader.py)
csstv_send "1"
csstv_retry_seconds "60"
// 1 = manda a la web una foto del mix al final de cada ronda (mixes en vivo; solo con System2)
csstv_live "1"
// 1 = anota las jugadas destacadas de cada ronda (3+ kills o clutch ganado) y las manda con el resultado (clips)
csstv_clips "1"

// --- Formato de partida ---
csstv_maxrounds "30"          // MR15
csstv_overtime "1"            // prórroga si hay empate
csstv_ot_maxrounds "6"        // MR12 por prórroga (6 = MR3)
csstv_ot_startmoney "12000"
csstv_lo3 "1"
csstv_halftime_delay "3.0"

// --- Inicio ---
csstv_ready_system "1"        // empieza cuando todos escriben !ready
csstv_ready_knife "1"         // el inicio por !ready empieza con ronda de cuchillo, como !live knife (0 = directo al LO3)
csstv_min_players "8"         // mínimo de jugadores en CT+T para el inicio automático por !ready (!live no lo pide)

// --- Estadísticas ---
csstv_assist_damage "41"
csstv_validate_steamid "0"    // dejar en 0 en servidores no-Steam
csstv_include_bots "0"        // solo para pruebas

// --- Durante la partida ---
csstv_chat_tag "CMLeague"     // prefijo de los mensajes: [CMLeague]
csstv_chat_colors "1"         // 0 solo colores básicos, 1 RGB para quien usa ClientMod, 2 siempre RGB
csstv_round_header "1"        // "Ronda 12/30 · Equipo X 7 - 4 Equipo Y", último round antes del cambio y match point
csstv_damage_report "1"       // a cada jugador, el daño de la ronda anterior
csstv_team_money "1"          // a cada equipo, su plata al empezar la ronda
csstv_hp_on_death "1"         // al morir: quién te mató y cuánta vida le quedó (y !hp)
csstv_alive_hud "1"           // contador de vivos "CT 5 vs 4 T": 0 no, 1 fijo arriba al centro, 2 en el centro de la pantalla
csstv_lock_teams "1"          // durante la partida no se cambia de equipo (un admin usa !team) y elegir modelo vivo no mata
csstv_bomb_frags "3"          // puntos de la bomba que se descuentan del TAB (0 = no tocar)
csstv_credits_interval "720"  // segundos entre los mensajes de créditos (0 = nunca)
csstv_tips_interval "180"     // segundos entre los consejos de comandos en el chat: !sell, !pause, !calladmin, !gg… (0 = nunca)

// --- Ronda de cuchillo (!live knife) y rendición (!gg) ---
csstv_knife_time "60"         // segundos que tiene el ganador del cuchillo para elegir lado (!stay / !switch)
csstv_gg_min_diff "8"         // rondas que tiene que ir perdiendo un equipo para poder rendirse (0 = !gg desactivado)
csstv_gg_missing "1"          // votos que pueden faltar en el equipo (1 = todos menos uno)

// --- Votación de mapa de los jugadores (!rtv, !vote <mapa>, !mapas), solo en el calentamiento ---
// La lista sale de la sección "csstv" de configs/maplists.cfg o, si no existe, del mapcycle.txt.
csstv_rtv "1"                 // 0 desactiva los comandos
csstv_rtv_ratio "0.6"         // parte de los jugadores (espectadores incluidos) que hace falta: 0.6 = 6 de 10
csstv_rtv_wait "30"           // segundos desde que carga el mapa antes de poder votar
csstv_rtv_cooldown "120"      // segundos de espera después de una votación que terminó en "No cambiar"
csstv_rtv_options "5"         // mapas en el menú de la votación (además de "No cambiar de mapa")

// --- Pausa táctica (!pause / !unpause) ---
csstv_pause_mode "3"          // 0 desactivadas, 1 con tiempo, 2 hasta !unpause de los dos equipos, 3 con tiempo o !unpause
csstv_pause_max "2"           // pausas por equipo y por partida
csstv_pause_time "60"         // segundos de cada pausa (modos 1 y 3)

// --- Demo (requiere +tv_enable 1 en la línea de arranque) ---
csstv_demo "1"                // grabar cstrike/csstv_demos/<match_uid>.dem
csstv_demo_keep "50"          // demos que se conservan (0 = todos)

// --- Web: !claim ---
csstv_claim "0"               // !claim: dejar en 0 hasta que la web nueva esté en producción (claim_with_code no existe antes)

csstv_enabled "1"
