// CSSTV QOL (csstv_qol.smx). Plan: docs/bitacora/2026-11-02-qol-tanda-2.

// Reaparecer a los 1,5 s en el calentamiento del reporter.
csstv_qol_warmup_respawn "1"

// Con la partida en vivo, decir al final de cada ronda quién hizo más daño y más kills.
csstv_qol_round_best "1"

// Segundos después del freezetime: si quien tiene la C4 no se movió, la tira (0 = no).
csstv_qol_c4_afk "20"

// Segundos después del fin de la partida: contraseña al azar, expulsar a todos y cambiar de mapa (0 = no).
// 40 para que la SourceTV llegue a mostrar el final. Por ahora solo prendido en MVZG (Kyan, 2026-11-02).
csstv_qol_end_kick "40"

// Desde la 1.1.0 (docs/bitacora/2026-11-02-qol-tanda-3):
// Quien se va en vivo y vuelve en la misma mitad recupera su plata y su equipo.
csstv_qol_restore "1"

// Segundos antes del fin del freezetime para mostrarle a cada equipo qué tiene cada uno (0 = no; !eq siempre).
csstv_qol_eq "6"

// Anunciar los clutch (1 vs 2 o más) a los muertos y los espectadores.
csstv_qol_clutch "1"

// Permitir !nades (práctica de granadas) en el calentamiento.
csstv_qol_nades "1"
