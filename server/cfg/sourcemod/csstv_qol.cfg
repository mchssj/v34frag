// CSSTV QOL (csstv_qol.smx). Plan: docs/bitacora/2026-11-02-qol-tanda-2.

// Reaparecer a los 1,5 s en el calentamiento del reporter.
csstv_qol_warmup_respawn "1"

// Con la partida en vivo, decir al final de cada ronda quién hizo más daño y más kills.
csstv_qol_round_best "1"

// Segundos después del freezetime: si quien tiene la C4 no se movió, la tira (0 = no).
csstv_qol_c4_afk "20"

// Segundos después del fin de la partida: contraseña al azar, expulsar a todos y cambiar de mapa (0 = no).
// 40 para que la SourceTV llegue a mostrar el final. Por ahora solo prendido en MVZG (Kyan, 2026-11-02).
csstv_qol_end_kick "40"

// Desde la 1.1.0 (docs/bitacora/2026-11-02-qol-tanda-3):
// Quien se va en vivo y vuelve en la misma mitad recupera su plata y su equipo.
csstv_qol_restore "1"

// Segundos antes del fin del freezetime para mostrarle a cada equipo qué tiene cada uno (0 = no; !eq siempre).
csstv_qol_eq "6"

// Anunciar los clutch (1 vs 2 o más) a los muertos y los espectadores.
csstv_qol_clutch "1"

// Permitir !nades (práctica de granadas) en el calentamiento.
csstv_qol_nades "1"

// Desde la 1.2.0 (docs/bitacora/2026-11-02-qol-tanda-4):
// Quien queda último vivo de su equipo no escucha a sus compañeros muertos hasta el final de la ronda (!voz lo desactiva para uno).
csstv_qol_clutch_mute "1"

// Al empezar cada ronda en vivo, mostrarles a los espectadores y a la SourceTV la plata de cada equipo (no a los coaches).
csstv_qol_spec_money "1"

// Con la partida en vivo, anunciar al final de la ronda a quien hizo 4 kills o un ace.
csstv_qol_ace "1"

// A los T: quién tiene la C4 al empezar la ronda y dónde quedó si muere quien la llevaba.
csstv_qol_c4_info "1"

// Durante la partida, los espectadores no escriben en el chat general (los admins sí).
csstv_qol_spec_chat "1"

// Durante la partida, los jugadores no escuchan a los espectadores (el coach sí, a su equipo).
csstv_qol_spec_voice "1"

// Durante la partida no se puede cambiar el nombre.
csstv_qol_lock_names "1"

// Durante la partida, kill y explode (suicidarse por consola) no hacen nada.
csstv_qol_block_kill "1"

// Durante la partida, avisar quién se fue y con qué K/D.
csstv_qol_goodbye "1"

// Desde la 1.2.1: en el calentamiento, segundos para borrar un arma tirada que nadie levantó (los cuerpos, a los 2 s). 0 = no limpiar.
csstv_qol_warmup_cleanup "8"
