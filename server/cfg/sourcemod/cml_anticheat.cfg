// CMLeague Anticheat: Bridge (cml_anticheat_bridge.smx) y estadísticas de aim (cml_aimstats.smx), que usan lo mismo.
// Plantilla: en cada servidor van su clave y su token (docs/bitacora/2026-11-27-anticheat-sin-eac/GUIA_IMPLEMENTACION.md).
// Sin la URL, el Bridge no revisa a nadie y no expulsa.

// Base de las RPC, terminada en /rest/v1/rpc/.
cml_ac_api_url "https://db.cmleague.lat/rest/v1/rpc/"

// La clave pública (anon) de la base: la misma de csstv_api_key.
cml_ac_api_key "PEGAR_ANON_KEY"

// El token de este servidor: el mismo de csstv_server_token.
cml_ac_server_token "PEGAR_TOKEN"

// 1 mientras se juega un mix. Lo cambian cfg/csstv/live.cfg (1) y warmup.cfg y end.cfg (0): acá va en 0.
cml_ac_mix "0"
