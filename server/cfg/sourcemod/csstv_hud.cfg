// CSSTV HUD: datos para el HUD de observer (bitácora 2026-10-22-hud-observer).
// El host, el puerto y la clave de cada servidor van solo en el cfg del servidor, nunca en el repo.
// Se pueden cambiar desde la consola sin recargar el plugin.

// 1: manda los datos al relay. 0: no manda nada. En RBK queda en 0 hasta que alguien transmita desde ahí.
csstv_hud "1"

// Dominio o IP y puerto UDP del relay (hoy, la dirección de playit.gg del streamer). Vacío: no manda nada.
csstv_hud_host ""
csstv_hud_port "0"

// Clave compartida con el relay (relay.json del streamer).
csstv_hud_key ""

// Cada cuántos segundos revisa qué cambió (0.1 a 2) y cada cuántos manda la foto completa (1 a 30).
csstv_hud_interval "0.25"
csstv_hud_full "3"
