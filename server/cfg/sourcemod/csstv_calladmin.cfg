// CSSTV CallAdmin (csstv_calladmin.smx): !calladmin a Discord y !map del moderador.
// La URL del webhook NO se versiona: en cada servidor se escribe a mano (copia en el .env, DISCORD_CALLADMIN_WEBHOOK).

// Activa !calladmin.
csstv_calladmin_enabled "1"

// URL del webhook de Discord del canal de reportes.
csstv_calladmin_webhook ""

// ID del rol de Discord a mencionar (@MOD). Vacío = sin mención.
csstv_calladmin_role "1561742511045738526"

// Nombre del servidor en el mensaje: "CMLeague #1" en el nuestro, "CMLeague #2" en RBK.
csstv_calladmin_server ""

// IP:puerto público para conectarse, sin contraseña: desde la 1.1.0 el plugin agrega la que tenga el servidor (sv_password).
// Vacío = ip y hostport del servidor (detrás del panel puede salir vacío).
csstv_calladmin_address ""

// Segundos entre dos reportes del mismo jugador.
csstv_calladmin_cooldown "120"

// Segundos entre dos reportes del servidor.
csstv_calladmin_global_cooldown "30"

// El moderador (override csstv_mod_map) puede cambiar el mapa sin mix en curso.
csstv_calladmin_modmap "1"
