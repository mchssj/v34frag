// CSSTV - partida. Se ejecuta antes del LO3.
// Reemplazá estos valores por tu config de mix habitual.
// IMPORTANTE: no cambies mp_maxrounds, mp_winlimit ni mp_timelimit: el plugin los deja en 0
// porque es el que decide cuándo termina la partida (MR15 + prórroga).
mp_startmoney 800
mp_freezetime 6
mp_roundtime 1.75
mp_buytime 0.25
mp_c4timer 35
mp_friendlyfire 1
mp_tkpunish 0
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
mp_flashlight 1
mp_footsteps 1
mp_forcecamera 1
mp_fadetoblack 0
sv_alltalk 0
