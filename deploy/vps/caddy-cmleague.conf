# Drop-in de caddy.service (plan docs/bitacora/2026-11-20-proteccion-ddos). Va en /etc/systemd/system/caddy.service.d/cmleague.conf.
# El 2026-11-20 un flood HTTP llevó a Caddy a 3,1 GB, el kernel lo mató y quedó caído: el paquete no trae Restart=.
[Service]
Restart=always
RestartSec=3
# Pasado MemoryMax el kernel lo mata solo a él (y Restart lo levanta), no a Supabase ni a la API.
# Sin MemoryHigh: con MemorySwapMax=0, el freno lo dejó colgado en 968 MB sin responder en vez de reiniciarse (2026-11-20).
MemoryMax=1G
# Sin swap: el 2026-11-20 se fue a 810 MB de swap y se arrastró todo el VPS en vez de reiniciarse rápido.
MemorySwapMax=0
